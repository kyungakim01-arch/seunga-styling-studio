<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>승아의 스타일링 스튜디오 v10 iPad</title>
<style>
:root {
  --pink:#ff4f93;
  --pink2:#ff2f84;
  --soft:#fff2f7;
  --line:#f0dfe7;
  --text:#302a30;
  --muted:#81757b;
  --shadow:0 12px 36px rgba(91,52,72,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:#fff9fc;color:var(--text)}
button,input{font:inherit}button{cursor:pointer}
.topbar{
  height:72px;display:flex;align-items:center;justify-content:space-between;
  padding:0 30px;background:#fff;border-bottom:1px solid #f5e3eb;position:sticky;top:0;z-index:30
}
.brand{font-size:27px;font-weight:850;color:var(--pink);white-space:nowrap}
.version{font-size:.45em;border:1px solid #ff91b9;border-radius:8px;padding:2px 7px;vertical-align:middle}
.top-actions{display:flex;gap:10px}
.top-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 17px;font-weight:750}
.top-btn.primary{background:linear-gradient(135deg,var(--pink),var(--pink2));border-color:var(--pink);color:#fff}
.layout{
  width:min(1440px,100%);margin:auto;padding:22px;
  display:grid;grid-template-columns:360px minmax(520px,1fr) 360px;gap:18px;align-items:start
}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.side{padding:18px;position:sticky;top:94px;max-height:calc(100vh - 110px);overflow:auto}
h2{margin:0 0 15px;font-size:20px}
.hair-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hair-btn{
  position:relative;border:1px solid var(--line);background:#fff;border-radius:13px;
  padding:5px;overflow:hidden;min-height:142px;transition:.15s
}
.hair-btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(102,58,80,.08)}
.hair-btn.active{border:3px solid var(--pink);padding:3px}
.hair-btn .number{position:absolute;left:7px;top:5px;color:var(--pink);font-size:12px;font-weight:850;z-index:2}
.hair-btn .check{
  display:none;position:absolute;right:6px;top:5px;width:22px;height:22px;border-radius:50%;
  background:var(--pink);color:#fff;align-items:center;justify-content:center;font-size:13px;z-index:3
}
.hair-btn.active .check{display:flex}
.hair-btn img{width:100%;height:128px;object-fit:contain;display:block;pointer-events:none}
.tip{margin-top:17px;padding:14px;border-radius:14px;background:linear-gradient(#fff2f7,#ffe6f0);font-size:13px;line-height:1.55}
.center{padding:15px;overflow:hidden}
.viewport{
  overflow:auto;border:1px dashed #f1bfd2;border-radius:15px;background:#fff;
  height:min(78vh,900px);min-height:690px;display:flex;align-items:flex-start;justify-content:center
}
.stage{
  position:relative;width:min(100%,640px);aspect-ratio:2/3;
  transform-origin:top center;flex:none;background:#fff
}
.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage img{object-fit:contain;pointer-events:none;user-select:none}
.stage canvas{touch-action:none;cursor:crosshair}
.zoom-controls{display:flex;justify-content:center;align-items:center;gap:9px;padding:15px 0 3px}
.zoom-controls button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;min-width:76px}
#zoomLabel{min-width:58px;text-align:center;font-weight:800}
.status{min-height:21px;text-align:center;font-size:13px;color:var(--muted)}
.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool-btn{
  border:1px solid var(--line);background:#fff;border-radius:12px;min-height:68px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:750
}
.tool-btn.active{background:var(--pink);border-color:var(--pink);color:#fff}
.section-title{margin:18px 0 10px;font-weight:800}
.section-title .value{float:right;color:var(--pink)}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:9px}
.swatch{width:27px;height:27px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d8cdd2}
.swatch.active{box-shadow:0 0 0 3px var(--pink)}
.precise{display:grid;grid-template-columns:1fr 104px;gap:10px;margin-top:14px}
.color-card{border:1px solid var(--line);border-radius:12px;padding:10px}
#colorPicker{width:100%;height:120px;border:0;padding:0;background:transparent}
.hex-column{display:flex;flex-direction:column;gap:8px}
#hexInput{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 7px;text-transform:uppercase}
#colorPreview{flex:1;min-height:72px;border:1px solid var(--line);border-radius:10px;background:var(--pink)}
.range-row{display:flex;align-items:center;gap:9px}#brushRange{flex:1}
.stylebook{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.style-card{position:relative;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.style-open{width:100%;border:0;background:#fff;padding:0;text-align:left}
.style-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.style-name{padding:7px 7px 2px;font-size:12px;font-weight:800}
.style-date{padding:0 7px 7px;font-size:10px;color:var(--muted)}
.delete-style{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:25px;height:25px;z-index:2}
.empty{grid-column:1/-1;padding:22px 8px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:11px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(40,25,34,.35);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.open{display:flex}
.dialog{width:min(430px,100%);background:#fff;padding:22px;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.dialog input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
footer{padding:15px;text-align:center;border-top:1px solid #f5e2eb;color:#8b7d84}
@media(max-width:849px){
  .topbar{height:auto;padding:14px;gap:10px;align-items:flex-start}
  .brand{font-size:20px} .top-actions{flex-wrap:wrap;justify-content:flex-end}
  .layout{grid-template-columns:1fr;padding:12px}
  .side{position:static;max-height:none} .hair-grid{grid-template-columns:repeat(4,1fr)}
  .viewport{min-height:560px;height:70vh} .stylebook{grid-template-columns:repeat(2,1fr)}
}

/* iPad 안정화 */
@media (min-width: 850px) and (max-width: 1199px) {
  .topbar { padding: 0 16px; }
  .brand { font-size: 22px; }
  .top-btn { padding: 9px 12px; }
  .layout {
    width: 100%;
    padding: 12px;
    grid-template-columns: 270px minmax(430px, 1fr) 290px;
    gap: 10px;
  }
  .side {
    top: 84px;
    padding: 13px;
    max-height: calc(100vh - 96px);
  }
  .hair-grid { gap: 7px; }
  .hair-btn { min-height: 116px; }
  .hair-btn img { height: 103px; }
  .center { padding: 10px; }
  .viewport {
    min-height: 620px;
    height: calc(100vh - 180px);
  }
  .stage { width: min(100%, 560px); }
  .tool-grid { gap: 5px; }
  .tool-btn { min-height: 60px; font-size: 13px; }
  .swatches { gap: 6px; }
  .swatch { width: 24px; height: 24px; }
  .precise { grid-template-columns: 1fr 86px; gap: 7px; }
  #colorPicker { height: 95px; }
}

/* 세로로 잡았을 때만 한 줄 배치 */
@media (max-width: 849px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; }
  .right-panel { grid-column: auto; }
}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">👑 승아의 스타일링 스튜디오 ✨ <span class="version">v10 iPad</span></div>
  <div class="top-actions">
    <button id="newBtn" class="top-btn">⊕ 새 디자인</button>
    <button id="saveBtn" class="top-btn">💾 저장</button>
    <button id="downloadBtn" class="top-btn primary">⇩ 이미지로 저장</button>
  </div>
</header>

<main class="layout">
  <aside class="panel side">
    <h2>헤어 스타일 선택</h2>
    <div id="hairGrid" class="hair-grid"></div>
    <div class="tip">💡 마음에 드는 헤어를 선택해보세요.<br>썸네일을 누르면 해당 완성 전신 모델이 중앙에 표시돼요.</div>
  </aside>

  <section class="panel center">
    <div id="viewport" class="viewport">
      <div id="stage" class="stage">
        <img id="modelImage" alt="선택한 전신 패션 모델">
        <canvas id="drawCanvas" width="1024" height="1536"></canvas>
      </div>
    </div>
    <div class="zoom-controls">
      <button id="zoomIn">확대 ＋</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomOut">－ 축소</button>
      <button id="fitBtn">⛶ 화면 맞춤</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <aside class="panel side right-panel">
    <h2>그리기 도구</h2>
    <div class="tool-grid">
      <button id="penBtn" class="tool-btn active">✎<span>펜</span></button>
      <button id="eraserBtn" class="tool-btn">⌫<span>지우개</span></button>
      <button id="undoBtn" class="tool-btn">↶<span>되돌리기</span></button>
      <button id="clearBtn" class="tool-btn">⌂<span>전체 지우기</span></button>
    </div>

    <div class="section-title">색상</div>
    <div id="swatches" class="swatches"></div>
    <div class="precise">
      <div class="color-card"><input id="colorPicker" type="color" value="#FF4F93"></div>
      <div class="hex-column">
        <input id="hexInput" value="#FF4F93" maxlength="7">
        <div id="colorPreview"></div>
      </div>
    </div>

    <div class="section-title">굵기 <span id="brushValue" class="value">6px</span></div>
    <div class="range-row"><span>1px</span><input id="brushRange" type="range" min="1" max="30" value="6"><span>30px</span></div>

    <div class="section-title">스타일북 <span id="styleCount" class="value">0</span></div>
    <div id="stylebook" class="stylebook"></div>
  </aside>
</main>

<footer>♥ 승아의 상상력이 빛나는 스타일을 응원해!</footer>

<div id="saveModal" class="modal">
  <div class="dialog">
    <h3>스타일 이름 저장</h3>
    <p>완성한 스타일에 이름을 붙여주세요.</p>
    <input id="styleName" maxlength="30" placeholder="예: 러블리 핑크 드레스">
    <div class="dialog-actions">
      <button id="cancelSave" class="top-btn">취소</button>
      <button id="confirmSave" class="top-btn primary">저장</button>
    </div>
  </div>
</div>

const HAIR_NAMES = ["롱 스트레이트", "글램 웨이브", "단발 볼륨컷", "롱 웨이브 앞머리", "어깨 길이 레이어드컷", "하이 포니테일", "시스루 뱅 롱", "탑 번", "양갈래 브레이드", "남성 스타일 숏컷", "애쉬 베이지 롱", "앞머리 없는 칼단발"];
const PALETTE = ["#111111","#666666","#999999","#BBBBBB","#FFFFFF","#A85E37","#B64524","#EF3340","#FFC400","#7CCB18","#0ABF8F","#2477D4","#5D39D5","#B44BE4","#F67BC6","#FFB2B2"];
const STORE_KEY = "seunga-style-studio-v8";

const modelImage = document.getElementById("modelImage");
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d", {willReadFrequently:true});
const stage = document.getElementById("stage");
const viewport = document.getElementById("viewport");
const colorPicker = document.getElementById("colorPicker");
const hexInput = document.getElementById("hexInput");
const colorPreview = document.getElementById("colorPreview");
const brushRange = document.getElementById("brushRange");
const brushValue = document.getElementById("brushValue");
const statusBox = document.getElementById("status");
const saveModal = document.getElementById("saveModal");
const styleName = document.getElementById("styleName");

let selectedHair = 0;
let tool = "pen";
let color = "#FF4F93";
let drawing = false;
let lastPoint = null;
let undoStack = [];
let redoStack = [];
let zoom = .8;
let styles = loadStyles();

ctx.lineCap = "round";
ctx.lineJoin = "round";

function announce(message) {
  statusBox.textContent = message;
  clearTimeout(announce.timer);
  announce.timer = setTimeout(() => statusBox.textContent = "", 2200);
}

function renderHairGrid() {
  const grid = document.getElementById("hairGrid");
  grid.innerHTML = "";
  THUMBS.forEach((src, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "hair-btn" + (index === selectedHair ? " active" : "");
    button.title = HAIR_NAMES[index];
    button.innerHTML = `<span class="number">${index+1}</span><span class="check">✓</span><img src="${src}" alt="${HAIR_NAMES[index]}">`;
    button.addEventListener("click", () => selectHair(index));
    grid.appendChild(button);
  });
}

function selectHair(index) {
  selectedHair = index;
  modelImage.src = MODELS[index];
  renderHairGrid();
  announce(`${index+1}번 ${HAIR_NAMES[index]}을 선택했어요.`);
}

function renderSwatches() {
  const wrap = document.getElementById("swatches");
  wrap.innerHTML = "";
  PALETTE.forEach(value => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "swatch" + (value.toUpperCase() === color ? " active" : "");
    button.style.background = value;
    button.title = value;
    button.addEventListener("click", () => setColor(value));
    wrap.appendChild(button);
  });
}

function setColor(value) {
  if (!/^#[0-9A-Fa-f]{6}$/.test(value)) {
    announce("색상 코드는 #RRGGBB 형식으로 입력해 주세요.");
    hexInput.value = color;
    return;
  }
  color = value.toUpperCase();
  colorPicker.value = color;
  hexInput.value = color;
  colorPreview.style.background = color;
  tool = "pen";
  syncTools();
  renderSwatches();
}

function syncTools() {
  document.getElementById("penBtn").classList.toggle("active", tool === "pen");
  document.getElementById("eraserBtn").classList.toggle("active", tool === "eraser");
}

function canvasPoint(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left) * canvas.width / rect.width,
    y: (event.clientY - rect.top) * canvas.height / rect.height
  };
}

function currentDrawing() {
  return canvas.toDataURL("image/png");
}

function pushUndo() {
  undoStack.push(currentDrawing());
  if (undoStack.length > 40) undoStack.shift();
  redoStack = [];
}

function restoreDrawing(dataUrl) {
  return new Promise(resolve => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if (!dataUrl) { resolve(); return; }
    const img = new Image();
    img.onload = () => { ctx.drawImage(img,0,0,canvas.width,canvas.height); resolve(); };
    img.onerror = () => resolve();
    img.src = dataUrl;
  });
}

function configureBrush() {
  ctx.lineWidth = Number(brushRange.value) * canvas.width / 1024;
  ctx.globalCompositeOperation = tool === "eraser" ? "destination-out" : "source-over";
  ctx.strokeStyle = color;
}

canvas.addEventListener("pointerdown", event => {
  event.preventDefault();
  pushUndo();
  drawing = true;
  canvas.setPointerCapture?.(event.pointerId);
  lastPoint = canvasPoint(event);
  configureBrush();
  ctx.beginPath();
  ctx.moveTo(lastPoint.x,lastPoint.y);
  ctx.lineTo(lastPoint.x+0.01,lastPoint.y+0.01);
  ctx.stroke();
});

canvas.addEventListener("pointermove", event => {
  if (!drawing) return;
  event.preventDefault();
  const point = canvasPoint(event);
  configureBrush();
  ctx.beginPath();
  ctx.moveTo(lastPoint.x,lastPoint.y);
  ctx.lineTo(point.x,point.y);
  ctx.stroke();
  lastPoint = point;
});

["pointerup","pointercancel","pointerleave"].forEach(type => canvas.addEventListener(type, () => {
  drawing = false;
  lastPoint = null;
}));

document.getElementById("penBtn").addEventListener("click", () => { tool = "pen"; syncTools(); });
document.getElementById("eraserBtn").addEventListener("click", () => { tool = "eraser"; syncTools(); });

document.getElementById("undoBtn").addEventListener("click", async () => {
  if (!undoStack.length) { announce("되돌릴 내용이 없어요."); return; }
  redoStack.push(currentDrawing());
  await restoreDrawing(undoStack.pop());
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (!confirm("그린 내용을 모두 지울까요?")) return;
  pushUndo();
  ctx.clearRect(0,0,canvas.width,canvas.height);
});

colorPicker.addEventListener("input", event => setColor(event.target.value));
hexInput.addEventListener("change", event => setColor(event.target.value.trim()));
brushRange.addEventListener("input", event => brushValue.textContent = `${event.target.value}px`);

function applyZoom() {
  stage.style.transform = `scale(${zoom})`;
  document.getElementById("zoomLabel").textContent = `${Math.round(zoom*100)}%`;
  viewport.style.paddingBottom = `${Math.max(0,stage.offsetHeight*(zoom-1))}px`;
}

document.getElementById("zoomIn").addEventListener("click", () => {
  zoom = Math.min(1.8, +(zoom + .1).toFixed(1));
  applyZoom();
});
document.getElementById("zoomOut").addEventListener("click", () => {
  zoom = Math.max(.6, +(zoom - .1).toFixed(1));
  applyZoom();
});
document.getElementById("fitBtn").addEventListener("click", () => {
  zoom = .8;
  applyZoom();
  viewport.scrollTo({top:0,left:0,behavior:"smooth"});
});

document.getElementById("newBtn").addEventListener("click", () => {
  if (!confirm("새 디자인을 시작할까요? 현재 그린 내용은 사라집니다.")) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  undoStack = [];
  redoStack = [];
  selectHair(0);
});

document.getElementById("saveBtn").addEventListener("click", () => {
  styleName.value = "";
  saveModal.classList.add("open");
  setTimeout(() => styleName.focus(),50);
});
document.getElementById("cancelSave").addEventListener("click", () => saveModal.classList.remove("open"));
saveModal.addEventListener("click", event => {
  if (event.target === saveModal) saveModal.classList.remove("open");
});

async function compositeDataUrl() {
  const output = document.createElement("canvas");
  output.width = 1024;
  output.height = 1536;
  const out = output.getContext("2d");
  out.fillStyle = "#ffffff";
  out.fillRect(0,0,output.width,output.height);
  const model = new Image();
  model.src = MODELS[selectedHair];
  await model.decode();
  out.drawImage(model,0,0,output.width,output.height);
  out.drawImage(canvas,0,0,output.width,output.height);
  return output.toDataURL("image/png");
}

document.getElementById("downloadBtn").addEventListener("click", async () => {
  const link = document.createElement("a");
  link.href = await compositeDataUrl();
  link.download = `seunga-style-${new Date().toISOString().slice(0,10)}.png`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  announce("PNG 이미지로 저장했어요.");
});

document.getElementById("confirmSave").addEventListener("click", async () => {
  const name = styleName.value.trim();
  if (!name) { alert("스타일 이름을 입력해 주세요."); return; }
  const item = {
    id: String(Date.now()),
    name,
    hair: selectedHair,
    drawing: currentDrawing(),
    preview: await compositeDataUrl(),
    date: new Date().toISOString()
  };
  styles.unshift(item);
  styles = styles.slice(0,20);
  persistStyles();
  renderStylebook();
  saveModal.classList.remove("open");
  announce("스타일북에 저장했어요.");
});

styleName.addEventListener("keydown", event => {
  if (event.key === "Enter") document.getElementById("confirmSave").click();
});

function loadStyles() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); }
  catch (_) { return []; }
}

function persistStyles() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(styles)); }
  catch (_) { announce("브라우저 저장 공간이 부족해 일부 스타일을 저장하지 못했어요."); }
}

function renderStylebook() {
  const book = document.getElementById("stylebook");
  document.getElementById("styleCount").textContent = styles.length;
  book.innerHTML = "";
  if (!styles.length) {
    book.innerHTML = '<div class="empty">아직 저장한 스타일이 없어요.</div>';
    return;
  }
  styles.forEach(style => {
    const card = document.createElement("article");
    card.className = "style-card";
    card.innerHTML = `
      <button class="delete-style" title="삭제">×</button>
      <button class="style-open" title="다시 열기">
        <img src="${style.preview}" alt="${style.name}">
        <div class="style-name">${escapeHtml(style.name)}</div>
        <div class="style-date">${new Date(style.date).toLocaleDateString("ko-KR")}</div>
      </button>`;
    card.querySelector(".style-open").addEventListener("click", () => loadStyle(style.id));
    card.querySelector(".delete-style").addEventListener("click", event => {
      event.stopPropagation();
      if (!confirm(`"${style.name}" 스타일을 삭제할까요?`)) return;
      styles = styles.filter(item => item.id !== style.id);
      persistStyles();
      renderStylebook();
    });
    book.appendChild(card);
  });
}

async function loadStyle(id) {
  const style = styles.find(item => item.id === id);
  if (!style) return;
  selectHair(style.hair);
  await restoreDrawing(style.drawing);
  undoStack = [];
  redoStack = [];
  announce(`"${style.name}" 스타일을 불러왔어요.`);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
}

selectHair(0);
setColor(color);
renderStylebook();
applyZoom();
</script>
</body>
</html>
